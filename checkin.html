<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Check-in</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 40px 20px; }
        .card { background: #161616; padding: 30px; border-radius: 20px; border: 1px solid #d4af37; max-width: 400px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .welcome { color: #d4af37; font-size: 1.8rem; }
        .already { color: #ff4d4d; font-size: 1.8rem; }
        .error { color: #ff4d4d; border: 1px solid #ff4d4d; padding: 10px; margin-top: 20px; font-size: 0.8rem; }
        .loader { border: 4px solid #333; border-top: 4px solid #d4af37; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="display">
        <div class="loader"></div>
        <p>Verifying Guest Status...</p>
    </div>

    <script>
    // This URL must match your Sheety Dashboard exactly
const SHEETY_API = 'https://api.sheety.co/916ecbf7a69ad28e779525330408df8b/guests/guestData'; 

const urlParams = new URLSearchParams(window.location.search);
const guestIdFromUrl = urlParams.get('id');

async function checkIn() {
    const display = document.getElementById('display');
    try {
        const response = await fetch(SHEETY_API);
        if (!response.ok) throw new Error(`Connection Failed (Status ${response.status})`);
        
        const data = await response.json();
        
        // This finds your list regardless of if it's called 'guestData' or 'guests'
        const listKey = Object.keys(data)[0];
        const guestsList = data[listKey];

        if (!guestsList || !Array.isArray(guestsList)) {
            throw new Error("Guest list data not found in API response.");
        }

        // Search for guest
        const guest = guestsList.find(g => {
            const idInSheet = g.guestId || g.guestid || g['guest id'];
            return String(idInSheet).trim() === String(guestIdFromUrl).trim();
        });

        if (!guest) {
            display.innerHTML = `<h2 class="error">GUEST NOT FOUND</h2><p>ID: ${guestIdFromUrl}</p>`;
            return;
        }

        if (guest.status === "Checked In") {
            display.innerHTML = `<h2 class="already">❌ ALREADY USED</h2><h1>${guest.name}</h1>`;
        } else {
            const updateUrl = `${SHEETY_API}/${guest.id}`;
            
            // CRITICAL: The wrapper 'guestData' must match your endpoint's singular name
            const bodyContent = {};
            bodyContent[Object.keys(data)[0].slice(0, -1) || 'guest'] = { status: 'Checked In' };
            // If the above is confusing, Sheety usually wants: { "guestData": { "status": "Checked In" } }

            const updateResponse = await fetch(updateUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    // This dynamically handles the singular name requirement
                    guestData: { status: 'Checked In' } 
                })
            });

            if (updateResponse.ok) {
                display.innerHTML = `<h2 class="welcome">✅ WELCOME</h2><h1>${guest.name || 'Guest'}</h1>`;
            } else {
                const errText = await updateResponse.text();
                console.error("Sheety error:", errText);
                throw new Error("Update blocked. Check if PUT is enabled in Sheety.");
            }
        }
    } catch (err) {
        display.innerHTML = `<h2 class="error">SYSTEM ERROR</h2><p>${err.message}</p>`;
    }
}

if (guestIdFromUrl) checkIn();   
    </script>
</body>
</html>
