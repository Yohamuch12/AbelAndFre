<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Check-in</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 40px 20px; }
        .card { background: #161616; padding: 30px; border-radius: 20px; border: 1px solid #d4af37; max-width: 400px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .welcome { color: #d4af37; font-size: 1.8rem; }
        .already { color: #ff4d4d; font-size: 1.8rem; }
        .error { color: #ff4d4d; border: 1px solid #ff4d4d; padding: 10px; margin-top: 20px; font-size: 0.8rem; }
        .loader { border: 4px solid #333; border-top: 4px solid #d4af37; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="display">
        <div class="loader"></div>
        <p>Verifying Guest Status...</p>
    </div>

    <script>
        // REPLACE THIS with your actual Sheety API URL
        const SHEETY_API = 'https://api.sheety.co/916ecbf7a69ad28e779525330408df8b/guests/guestData'; 
        
        const urlParams = new URLSearchParams(window.location.search);
        const guestIdFromUrl = urlParams.get('id');

        async function checkIn() {
            const display = document.getElementById('display');
            try {
                const response = await fetch(SHEETY_API);
                if (!response.ok) throw new Error(`API Connection Failed (Status ${response.status})`);
                
                const data = await response.json();
                
                // --- THE AUTO-FIXER ---
                // This looks for 'guests', but if Sheety renamed it, it grabs the first available list.
                let guestsList = data.guests || data[Object.keys(data)[0]];

                if (!guestsList || !Array.isArray(guestsList)) {
                    throw new Error("Guest list data is empty or invalid.");
                }

                // Search for the guest. We check 'guestId' and 'guestid' to be safe.
                const guest = guestsList.find(g => {
                    const idInSheet = g.guestId || g.guestid || g['guest id'];
                    return String(idInSheet).trim() === String(guestIdFromUrl).trim();
                });

                if (!guest) {
                    display.innerHTML = `<h2 class="error">GUEST NOT FOUND</h2><p>ID: ${guestIdFromUrl}</p>`;
                    return;
                }

                if (guest.status === "Checked In") {
                    display.innerHTML = `<h2 class="already">❌ ALREADY USED</h2><h1>${guest.name}</h1><p>Scanned previously.</p>`;
                } else {
                    // Update the status using PUT
                    const updateResponse = await fetch(`${SHEETY_API}/${guest.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ guest: { status: 'Checked In' } })
                    });

                    if (updateResponse.ok) {
                        display.innerHTML = `<h2 class="welcome">✅ WELCOME</h2><h1>${guest.name}</h1><p>Entrance Granted</p>`;
                    } else {
                        throw new Error("Could not update status. Check if PUT is enabled in Sheety.");
                    }
                }
            } catch (err) {
                display.innerHTML = `<h2 class="error">SYSTEM ERROR</h2><p>${err.message}</p>`;
            }
        }

        if (guestIdFromUrl) checkIn();
        else display.innerHTML = "<h2>No Guest ID provided.</h2>";
    </script>
</body>
</html>
