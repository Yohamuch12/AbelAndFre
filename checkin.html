<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrance Validation</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 50px 20px; }
        .card { background: #161616; padding: 40px; border-radius: 20px; border: 1px solid #d4af37; max-width: 400px; margin: 0 auto; }
        .welcome { color: #d4af37; font-size: 2.2rem; margin-bottom: 10px; }
        .error { color: #ff4d4d; font-size: 1.2rem; }
        .id-badge { background: #333; padding: 5px 15px; border-radius: 5px; font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>
    <div class="card" id="display">
        <p>Processing QR Code...</p>
    </div>

    <script>
        // ADD YOUR GUESTS HERE
        // Format: "GUEST_ID": "GUEST_NAME"
        const guestData = {
            "G001": "Dr. Meron",
            "G002": "Abel Bekele",
            "G003": "Frehiwot Tadesse",
            // Keep adding all 93 guests here...
            "G093": "Last Guest Name"
        };

        const urlParams = new URLSearchParams(window.location.search);
        const guestId = urlParams.get('id');

        function validate() {
            const display = document.getElementById('display');
            
            if (!guestId) {
                display.innerHTML = "<h2 class='error'>No ID Detected</h2><p>Please scan a valid QR code.</p>";
                return;
            }

            const name = guestData[guestId.trim()];

            if (name) {
                display.innerHTML = `
                    <p class="id-badge">VERIFIED GUEST</p>
                    <h2 class="welcome">WELCOME</h2>
                    <h1>${name}</h1>
                    <p style="color: #888;">Entrance Granted for Abel & Fre's Wedding</p>
                `;
            } else {
                display.innerHTML = `
                    <h2 class="error">INVALID TICKET</h2>
                    <p>ID: ${guestId} was not found on the guest list.</p>
                `;
            }
        }

        // Run immediately
        validate();
    </script>
</body>
</html>
