<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Check-in</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 50px 20px; }
        .card { background: #161616; padding: 30px; border-radius: 20px; border: 1px solid #d4af37; max-width: 400px; margin: 0 auto; }
        .welcome { color: #d4af37; font-size: 1.5rem; }
        .error { color: #ff4d4d; }
        .loader { border: 4px solid #333; border-top: 4px solid #d4af37; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="display">
        <div class="loader"></div>
        <p>Verifying Guest...</p>
    </div>

    <script>
       // NEW DEBUG VERSION
const SHEETY_API = 'https://api.sheety.co/916ecbf7a69ad28e779525330408df8b/guestData/guestData'; // Double check this!

const urlParams = new URLSearchParams(window.location.search);
const guestId = urlParams.get('id');

async function verifyGuest() {
    const display = document.getElementById('display');
    try {
        console.log("Attempting to fetch from:", SHEETY_API);
        const response = await fetch(SHEETY_API);
        
        if (!response.ok) {
            throw new Error(`HTTP Error! Status: ${response.status}`);
        }

        const data = await response.json();
        console.log("Data received:", data);

        // NOTE: 'guests' must match your sheet tab name exactly
        const guest = data.guests.find(g => g.guestId === guestId);

        if (!guest) {
            display.innerHTML = `<h2 style="color:red">INVALID ID</h2><p>ID ${guestId} not found in the list.</p>`;
            return;
        }

        if (guest.status === "Checked In") {
            display.innerHTML = `<div class="already">❌ ALREADY USED</div><div class="guest-name">${guest.name}</div>`;
        } else {
            // Update the status in the sheet
            const updateResponse = await fetch(`${SHEETY_API}/${guest.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guest: { status: 'Checked In' } })
            });

            if (updateResponse.ok) {
                display.innerHTML = `<div class="welcome">✅ WELCOME</div><div class="guest-name">${guest.name}</div>`;
            } else {
                throw new Error("Failed to update status in Google Sheet.");
            }
        }
    } catch (err) {
        console.error(err);
        display.innerHTML = `<h2 style="color:red">SYSTEM ERROR</h2>
                             <p style="font-size:0.8rem">${err.message}</p>
                             <p>Please check your Sheety API settings.</p>`;
    }
}

if (guestId) verifyGuest();
else display.innerHTML = "<h1>No ID provided</h1>";    </script>
</body>
</html>
