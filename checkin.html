<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrance Check-in</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 50px 20px; }
        .card { background: #161616; padding: 40px; border-radius: 20px; border: 1px solid #d4af37; max-width: 400px; margin: 0 auto; }
        .welcome { color: #d4af37; font-size: 2rem; }
        .already { color: #ff4d4d; font-size: 1.5rem; }
        .loader { border: 4px solid #333; border-top: 4px solid #d4af37; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="display">
        <div class="loader"></div>
        <p>Verifying Guest...</p>
    </div>

    <script>
        // REPLACE 'YOUR_PROJECT_ID' with the ID from your Sheety Dashboard
        const SHEETY_API = 'https://api.sheety.co/916ecbf7a69ad28e779525330408df8b/guestData/guestData';
        
        const urlParams = new URLSearchParams(window.location.search);
        const guestIdFromUrl = urlParams.get('id');

        async function verify() {
            const display = document.getElementById('display');
            try {
                const response = await fetch(SHEETY_API);
                if (!response.ok) throw new Error("Could not connect to guest list.");
                
                const data = await response.json();
                // Find guest by matching IDs
                const guest = data.guests.find(g => String(g.guestId).trim() === String(guestIdFromUrl).trim());

                if (!guest) {
                    display.innerHTML = `<h2 style="color:red">NOT FOUND</h2><p>ID ${guestIdFromUrl} is invalid.</p>`;
                    return;
                }

                if (guest.status === "Checked In") {
                    display.innerHTML = `<h2 class="already">❌ ALREADY USED</h2><h1>${guest.name}</h1>`;
                } else {
                    // Update the Google Sheet
                    await fetch(`${SHEETY_API}/${guest.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ guest: { status: 'Checked In' } })
                    });
                    display.innerHTML = `<h2 class="welcome">✅ WELCOME</h2><h1>${guest.name}</h1>`;
                }
            } catch (err) {
                display.innerHTML = `<h2 style="color:red">SYSTEM ERROR</h2><p>${err.message}</p>`;
            }
        }
        if (guestIdFromUrl) verify();
    </script>
</body>
</html>
