<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Check-in</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 40px; }
        .card { background: #161616; padding: 30px; border-radius: 20px; border: 1px solid #d4af37; max-width: 400px; margin: 0 auto; }
        .welcome { color: #d4af37; font-size: 2rem; }
        .error { color: #ff4d4d; }
    </style>
</head>
<body>
    <div class="card" id="display">Verifying...</div>

    <script>
        // 1. Get your real API URL from the Sheety Dashboard
        const SHEETY_API = 'https://api.sheety.co/916ecbf7a69ad28e779525330408df8b/guestData/guestData';
        
        const urlParams = new URLSearchParams(window.location.search);
        const guestId = urlParams.get('id');

        async function doCheckIn() {
            const display = document.getElementById('display');
            try {
                const response = await fetch(SHEETY_API);
                if (!response.ok) throw new Error("API Connection Failed");
                
                const data = await response.json();
                // Find guest (Sheety converts "GUEST ID" to "guestId")
                const guest = data.guests.find(g => String(g.guestId) === String(guestId));

                if (!guest) {
                    display.innerHTML = `<h2 class="error">INVALID ID</h2>`;
                    return;
                }

                if (guest.status === "Checked In") {
                    display.innerHTML = `<h2 style="color:red">ALREADY USED</h2><h3>${guest.name}</h3>`;
                } else {
                    // Update Status
                    await fetch(`${SHEETY_API}/${guest.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ guest: { status: 'Checked In' } })
                    });
                    display.innerHTML = `<h2 class="welcome">WELCOME</h2><h1>${guest.name}</h1>`;
                }
            } catch (err) {
                display.innerHTML = `<h2 class="error">SYSTEM ERROR</h2><p>${err.message}</p>`;
            }
        }
        if (guestId) doCheckIn();
    </script>
</body>
</html>
