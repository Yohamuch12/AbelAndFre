        const urlParams = new URLSearchParams(window.location.search);
        const guestId = urlParams.get('id');

        function validate() {
            const display = document.getElementById('display');
            
            if (!guestId) {
                display.innerHTML = "<h2 class='error'>No ID Detected</h2><p>Please scan a valid QR code.</p>";
                return;
            }

            const cleanId = guestId.trim();
            const name = guestData[cleanId];

            if (name) {
                if (localStorage.getItem('scanned_' + cleanId)) {
                    display.innerHTML = `
                        <p class="id-badge">DUPLICATE ENTRY</p>
                        <h2 class="already">❌ ALREADY SCANNED</h2>
                        <h1>${name}</h1>
                        <p style="color: #888;">This guest has already entered.</p>
                        <button onclick="if(confirm('Reset this guest?')){localStorage.removeItem('scanned_${cleanId}'); location.reload();}">Allow Re-entry</button>
                    `;
                } else {
                    localStorage.setItem('scanned_' + cleanId, 'true');
                    display.innerHTML = `
                        <p class="id-badge">VERIFIED GUEST</p>
                        <h2 class="welcome">✅ WELCOME</h2>
                        <h1>${name}</h1>
                        <p style="color: #888;">Entrance Granted for Abel & Fre's Wedding</p>
                    `;
                }
            } else {
                display.innerHTML = `
                    <h2 class="error">INVALID TICKET</h2>
                    <p>ID: ${cleanId} not found on the official list.</p>
                `;
            }
        }
